<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140D08">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Nana — Home (Triptyque)</title>
<style>
  :root{
    --bg: #140D08;
    --text: #F3E7CE;
    --muted: rgba(243,231,206,0.68);
    --accent: #E8A94D;
    --card-border: rgba(243,231,206,0.18);
    --font-display: 'Fraunces', ui-rounded, -apple-system, 'SF Pro Rounded', sans-serif;
    --font-body: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  }
  html[data-font="dyslexic"]{ --font-display: 'Atkinson Hyperlegible', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  .header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: max(18px, env(safe-area-inset-top)) 20px 16px;
  }
  .eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 4px 0 0; }
  .font-btn {
    background: rgba(243,231,206,0.08); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 13.5px; cursor: pointer; min-height: 44px; flex-shrink: 0;
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .offline-banner {
    margin: 0 20px 16px; padding: 12px 14px; border-radius: 12px; background: rgba(232,169,77,0.12);
    border: 1px solid rgba(232,169,77,0.32); color: var(--accent); font-size: 13px; text-align: center;
  }

  /* Triptyque : 3 zones de la chambre = 3 scènes, empilées sur mobile,
     côte à côte sur iPad. Le panneau central pose l'ambiance sans lien. */
  .triptych { display: flex; flex-direction: column; gap: 3px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  @media (min-width: 720px) {
    .triptych { flex-direction: row; align-items: stretch; height: 62vh; }
    .panel { flex: 1; height: 100%; }
  }

  .panel { position: relative; overflow: hidden; min-height: 30vh; }
  .panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .panel-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,3,0.05) 40%, rgba(10,6,3,0.88) 100%); }
  .panel-title {
    position: absolute; left: 18px; right: 18px; bottom: 16px;
    font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0 0 10px;
  }
  .panel-actions { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  .panel-btn {
    display: flex; align-items: center; gap: 10px; background: rgba(20,13,8,0.6); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 11px 14px; color: var(--text); font-family: var(--font-body); font-size: 13.5px; font-weight: 600;
    cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-align: left;
  }
  .panel-btn svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent); }

  .panel-center .panel-scrim { background: linear-gradient(180deg, rgba(10,6,3,0.15), rgba(10,6,3,0.55)); }
  .panel-center .center-caption {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; padding: 0 24px;
  }
  .center-caption .eyebrow-mini { font-family: var(--font-display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  .center-caption p { font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--text); margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="header">
  <div>
    <p class="eyebrow">World's Nana</p>
    <h1>Coucou !</h1>
  </div>
  <button class="font-btn" id="font-toggle" type="button" aria-pressed="false">Aa dyslexie</button>
</div>
<div class="offline-banner" id="offline-banner" hidden>Pas de connexion — les raccourcis déjà installés restent utilisables.</div>

<div class="triptych">
  <div class="panel panel-left">
    <img src="./assets/portal-left.jpg" alt="Commode, lampe étoilée et portrait au mur.">
    <div class="panel-scrim"></div>
    <p class="panel-title">Créer</p>
    <div class="panel-actions" id="actions-left"></div>
  </div>
  <div class="panel panel-center">
    <img src="./assets/portal-center.jpg" alt="Une fillette face à un tourbillon lumineux dans l'embrasure de la porte.">
    <div class="panel-scrim"></div>
    <div class="center-caption">
      <p class="eyebrow-mini">Ce soir</p>
      <p>Chaque porte cache une nouvelle aventure.</p>
    </div>
  </div>
  <div class="panel panel-right">
    <img src="./assets/portal-right.jpg" alt="Étagère avec peluches et livres, bureau, lit.">
    <div class="panel-scrim"></div>
    <p class="panel-title">Se poser</p>
    <div class="panel-actions" id="actions-right"></div>
  </div>
</div>

<script>
/* ============================================================
   Home — variante "Triptyque" : 3 zones de la chambre racontent
   3 humeurs (créer / explorer / se poser). Panneau central =
   ambiance, sans raccourci. assets/portal-{left,center,right}.jpg
   Icônes ligne dessinées à la main (pas d'emoji).
   Raccourcis illustratifs — à remplacer par la liste définie
   séparément (voir frontend.md, écran 2).
   ============================================================ */

const ICONS = {
  musique: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5.2L20 3v12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.5" cy="15.8" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>`,
  dessin: `<svg viewBox="0 0 24 24" fill="none"><polygon points="14,3 20,9 9,20 4,20.5 4.5,15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="12" y1="5" x2="18" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  lecture: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 5 Q9 2 11 5 V19 Q9 16 3 19 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M21 5 Q15 2 13 5 V19 Q15 16 21 19 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  jeux: `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="12" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="8.5" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>`,
};

const LEFT_SHORTCUTS = [
  { id: 'dessin', label: 'Dessiner', icon: ICONS.dessin, scheme: 'shortcuts://', storeUrl: 'https://apps.apple.com/app/procreate-pocket/id427525720' },
  { id: 'musique', label: 'Musique', icon: ICONS.musique, scheme: 'music://', storeUrl: 'https://apps.apple.com/app/apple-music/id1108187390' },
];
const RIGHT_SHORTCUTS = [
  { id: 'lecture', label: 'Lecture', icon: ICONS.lecture, scheme: 'shortcuts://', storeUrl: '#' },
  { id: 'jeux', label: 'Jeux éducatifs', icon: ICONS.jeux, scheme: 'shortcuts://', storeUrl: '#' },
];

function openShortcut(shortcut) {
  const fallbackTimer = setTimeout(() => {
    if (shortcut.storeUrl && shortcut.storeUrl !== '#') window.location.href = shortcut.storeUrl;
  }, 1200);
  window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
  window.location.href = shortcut.scheme;
}

function renderActions(containerId, shortcuts) {
  const container = document.getElementById(containerId);
  shortcuts.forEach((s) => {
    const btn = document.createElement('button');
    btn.className = 'panel-btn';
    btn.type = 'button';
    btn.innerHTML = `${s.icon}<span>${s.label}</span>`;
    btn.addEventListener('click', () => openShortcut(s));
    container.appendChild(btn);
  });
}
renderActions('actions-left', LEFT_SHORTCUTS);
renderActions('actions-right', RIGHT_SHORTCUTS);

const fontToggle = document.getElementById('font-toggle');
const FONT_KEY = 'wn.font';
function applyFont(pref) {
  document.documentElement.dataset.font = pref;
  fontToggle.setAttribute('aria-pressed', String(pref === 'dyslexic'));
}
applyFont(localStorage.getItem(FONT_KEY) || 'default');
fontToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.font === 'dyslexic' ? 'default' : 'dyslexic';
  localStorage.setItem(FONT_KEY, next);
  applyFont(next);
});

const offlineBanner = document.getElementById('offline-banner');
function updateOnlineState() { offlineBanner.hidden = navigator.onLine; }
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
