/* Positions calculées par projection équirectangulaire simple à partir de
   coordonnées lat/lon réelles. La carte de fond est stylisée, pas une
   projection cartographique précise — seules les positions relatives
   entre pastilles sont fiables. */
const MAP_W = 280, MAP_H = 160;
function projectLatLon(lat, lon) {
  return {
    x: ((lon + 180) / 360) * MAP_W,
    y: ((90 - lat) / 180) * MAP_H,
  };
}

  formation_terre: c => `<circle cx="20" cy="20" r="11" fill="${c}" opacity="0.3"/><path d="M12 14 Q20 10 28 14 Q30 20 26 26 Q20 30 14 26 Q10 20 12 14 Z" fill="${c}"/>`,
  atmosphere_primitive: c => `<circle cx="20" cy="20" r="8" fill="${c}" opacity="0.6"/><ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="3 3"/>`,
  ocean_primitif: c => `<path d="M6 22 Q13 15 20 22 T34 22" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M6 27 Q13 20 20 27 T34 27" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle cx="20" cy="14" r="2.5" fill="${c}"/>`,

};

function glyphSVG(type, color, size) {
  size = size || 40;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">${(GLYPHS[type]||GLYPHS.atmosphere)(color)}</svg>`;
}

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");
}

/* -------------------- state -------------------- */
const STORAGE_KEY = "brique_progress_v1";

const state = {
  status: Object.fromEntries(BRICKS.map(b => [b.id, "locked"])),
  geoStatus: Object.fromEntries(GEO_PLACES.map(g => [g.id, "locked"])),
  unlockedCards: 0,
  activeBrickId: null,
  activeGeoId: null,
  step: null,
  screen: "home", // home | session | gallery | geoMap | geoSession
};
state.status.atmosphere = "ready";
state.status.biodiversite = "ready";
state.geoStatus.france = "ready";

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      status: state.status,
      geoStatus: state.geoStatus,
      unlockedCards: state.unlockedCards,
    }));
  } catch (e) { /* stockage indisponible, on continue sans sauvegarder */ }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.status) state.status = { ...state.status, ...data.status };
    if (data.geoStatus) state.geoStatus = { ...state.geoStatus, ...data.geoStatus };
    if (typeof data.unlockedCards === "number") state.unlockedCards = data.unlockedCards;
  } catch (e) { /* données corrompues, on repart de zéro sans planter */ }
}

function resetProgress() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.status = Object.fromEntries(BRICKS.map(b => [b.id, "locked"]));
  state.status.atmosphere = "ready";
  state.status.biodiversite = "ready";
  state.geoStatus = Object.fromEntries(GEO_PLACES.map(g => [g.id, "locked"]));
  state.geoStatus.france = "ready";
  state.unlockedCards = 0;
  state.screen = "home";
  render();
}

const root = document.getElementById("root");

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function render() {
  if (state.screen === "home") root.innerHTML = HomeScreen();
  else if (state.screen === "gallery") root.innerHTML = GalleryScreen();
  else if (state.screen === "session") root.innerHTML = SessionScreen();
  else if (state.screen === "recap") root.innerHTML = RecapScreen();
  else if (state.screen === "geoMap") root.innerHTML = GeoMapScreen();
  else if (state.screen === "geoSession") root.innerHTML = GeoSessionScreen();
  bindEvents();
}

/* petite mélodie synthétisée, aucun fichier externe, se joue uniquement si on la demande */
function playCardChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol, doux
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.14;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.15, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.5);
    });
  } catch (e) { /* audio indisponible, tant pis, pas bloquant */ }
}

function markGeoMastered(id) {

function GeoSessionScreen() {

function GeoEncodeStep(place) {
  return `
    <div class="card">
      <p class="step-label">Découverte</p>
      <div class="glyph-badge" style="background:${place.color}22">
        <div style="width:40px;height:40px;border-radius:50%;background:${place.color}"></div>
      </div>
      <h2 class="word-display">${place.country}</h2>
      <p class="def-text">Capitale : <strong>${place.capital}</strong><br>Continent : ${place.continent}</p>
      <button class="primary-btn" id="geoToGuided">Continuer</button>
      <p class="hint-footer">Prends ton temps, rien n'est chronométré ici.</p>
    </div>`;
}

function GeoGuidedStep(place) {
  const options = sessionData.geoOptions || (sessionData.geoOptions = shuffleGeoOptions(place));
  const chips = options.map(o => `
    <button class="geo-choice" data-geo-choice="${o.id}">${o.country}</button>
  `).join("");
  return `
    <div class="card">
      <p class="step-label">Retrouve le bon pays</p>
      <p class="def-text">Où se trouve <strong>${place.capital}</strong> ?</p>
      <div class="geo-choice-grid">${chips}</div>
      ${sessionData.geoMessage ? `<p class="soft-message">${sessionData.geoMessage}</p>` : ""}
      <div class="row-btns">
        <button class="secondary-btn" id="geoBackToEncode">Revoir</button>
      </div>
    </div>`;
}

function shuffleGeoOptions(place) {
  const others = GEO_PLACES.filter(g => g.id !== place.id).sort(() => Math.random() - 0.5).slice(0, 2);
  return [place, ...others].sort(() => Math.random() - 0.5);
}

function GeoFreeStep(place) {
  const f = sessionData.geoFree || (sessionData.geoFree = { attempts: 0, revealed: 0, message: null });
  const revealed = place.capital.split("").map((c, i) => (i < f.revealed || c === " " ? c : "_")).join("");
  return `
    <div class="card">
      <p class="step-label">À toi de le dire</p>
      <p class="question-text">${place.clue}<br><br>Quel est ce pays, et quelle est sa capitale ?</p>

      <div class="row-btns">
        <button class="secondary-btn" id="geoBackToGuided">Revoir</button>
        <button class="primary-btn" id="geoSubmitFree">Valider</button>
      </div>
      <p class="hint-footer">Personne d'autre ne voit tes essais.</p>
    </div>`;
}

/* -------------------- session -------------------- */
let sessionData = {}; // transient per-brick working state

function SessionScreen() {
  const brick = BRICKS.find(b => b.id === state.activeBrickId);
  const steps = ["encode", "guided", "free"];
  const dots = steps.map(s => `<div class="dot ${s === state.step ? "active" : ""}"></div>`).join("");

  let body = "";
  if (state.step === "encode") body = EncodeStep(brick);
  if (state.step === "guided") body = GuidedStep(brick);
  if (state.step === "free") body = FreeStep(brick);

  return `
    <div class="session">
      <div class="session-top">
        <button class="exit-btn" data-nav="home">← Ma planète</button>
        <div class="step-dots">${dots}</div>
      </div>
      ${body}
    </div>`;
}

function EncodeStep(brick) {
  const explainOpen = sessionData.explainOpen === brick.id;
  return `
    <div class="card">
      <p class="step-label">Découverte</p>
      <div class="glyph-badge" style="background:${brick.color}22">${glyphSVG(brick.glyph, brick.color, 52)}</div>
      <h2 class="word-display">${brick.word}</h2>
      <p class="def-text">${brick.def}</p>
      <button class="explain-btn" id="explainToggle">Explique-moi autrement</button>
      ${explainOpen ? `<p class="explain-box">${brick.example}</p>` : ""}
      <div style="margin-bottom:18px">
        <p class="sketch-label">Dessine ta propre idée de ce mot (facultatif)</p>
        <canvas class="sketch" id="sketchCanvas" width="280" height="130"></canvas>
        <button class="clear-btn" id="clearSketch">Effacer</button>
      </div>
      <button class="primary-btn" id="toGuided">Continuer</button>
      <p class="hint-footer">Prends ton temps, rien n'est chronométré ici.</p>
    </div>`;
}

function GuidedStep(brick) {
  if (!sessionData.guided || sessionData.guidedFor !== brick.id) {
    const shuffled = [...brick.syllables].sort(() => Math.random() - 0.5);
    sessionData.guided = {
      pool: shuffled.map((s, i) => ({ id: i, text: s })),
      slots: Array(brick.syllables.length).fill(null),
      showHint: false,
      message: null,
    };
    sessionData.guidedFor = brick.id;
  }
  const g = sessionData.guided;
  const slotsHtml = g.slots.map((chip, i) =>
    `<button class="slot" data-return="${i}" style="border-color:${chip ? brick.color : "rgba(245,241,232,0.25)"}">${chip ? chip.text : ""}</button>`
  ).join("");
  const chipsHtml = g.pool.map(chip =>
    `<button class="chip" data-place="${chip.id}">${chip.text}</button>`
  ).join("");
  const complete = g.slots.every(s => s !== null);

  return `
    <div class="card">
      <p class="step-label">Reconstitue le mot</p>
      <div class="glyph-badge" style="width:64px;height:64px;background:${brick.color}22">${glyphSVG(brick.glyph, brick.color, 34)}</div>
      <div class="slots-row">${slotsHtml}</div>
      <div class="chip-row">${chipsHtml}</div>
      ${g.showHint ? `<p class="hint-box">Indice — ${brick.hint}</p>` : ""}
      ${g.message ? `<p class="soft-message">${g.message}</p>` : ""}
      <div class="row-btns">
        <button class="secondary-btn" id="backToEncode">Revoir</button>
        <button class="primary-btn" id="checkGuided" ${complete ? "" : "disabled"}>Vérifier</button>
      </div>
    </div>`;
}

function FreeStep(brick) {
  if (!sessionData.free || sessionData.freeFor !== brick.id) {
    sessionData.free = { attempts: 0, revealedLetters: 0, message: null, value: "" };
    sessionData.freeFor = brick.id;
  }
  const f = sessionData.free;
  const revealed = brick.word.split("").map((c, i) => (i < f.revealedLetters || c === " " ? c : "_")).join("");

  return `
    <div class="card">
      <p class="step-label">À toi de le dire</p>
      <p class="question-text">${brick.question}</p>
      <input class="text-input" id="freeInput" placeholder="Écris ta réponse ici" value="${f.value}">
      ${f.revealedLetters > 0 ? `<p class="reveal-box">${revealed}</p>` : ""}
      ${f.message ? `<p class="soft-message">${f.message}</p>` : ""}
      <div class="row-btns">
        <button class="secondary-btn" id="backToGuided">Revoir les syllabes</button>
        <button class="primary-btn" id="submitFree">Valider</button>
      </div>
      <p class="hint-footer">Personne d'autre ne voit tes essais.</p>
    </div>`;
}

/* -------------------- interactions -------------------- */
function openBrick(id) {
  if (state.status[id] === "locked") return;
  state.activeBrickId = id;
  state.step = "encode";
  state.screen = "session";
  sessionData = {};
  render();
}

function markMastered(id) {
  state.status[id] = "mastered";
  const idx = BRICKS.findIndex(b => b.id === id);
  const next = BRICKS[idx + 1];
  if (next && state.status[next.id] === "locked") state.status[next.id] = "ready";

  const masteredCount = Object.values(state.status).filter(s => s === "mastered").length;
  let unlockedNewCard = false;
  if (masteredCount % 2 === 0 && state.unlockedCards < CARDS.length) {
    state.unlockedCards = Math.min(state.unlockedCards + 1, CARDS.length);
    unlockedNewCard = true;
  }
  saveProgress();

  // Un thème vient-il d'être entièrement complété ?
  const brick = BRICKS.find(b => b.id === id);
  const moduleBricks = BRICKS.filter(b => b.module === brick.module);
  const moduleComplete = moduleBricks.every(b => state.status[b.id] === "mastered");

  if (moduleComplete) {
    state.recapModule = brick.module;
    state.screen = "recap";
    render();
  } else if (unlockedNewCard) {
    state.freshCard = true;
    state.screen = "gallery";
    render();
  } else {
    state.screen = "home";
    render();
    showToast("✦ Brique posée sur ta planète");
  }
}

function bindEvents() {
  root.querySelectorAll("[data-open]").forEach(el =>
    el.addEventListener("click", () => openBrick(el.dataset.open)));
  root.querySelectorAll("[data-nav]").forEach(el =>
    el.addEventListener("click", () => { state.screen = el.dataset.nav; render(); }));
  const resetBtn = root.querySelector("[data-reset]");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    if (confirm("Effacer toute la progression d'Anaïs et repartir de zéro ?")) resetProgress();
  });

  const toGuided = document.getElementById("toGuided");
  if (toGuided) toGuided.addEventListener("click", () => { state.step = "guided"; render(); });

  const explainToggle = document.getElementById("explainToggle");
  if (explainToggle) explainToggle.addEventListener("click", () => {
    sessionData.explainOpen = sessionData.explainOpen === state.activeBrickId ? null : state.activeBrickId;
    render();
  });

  root.querySelectorAll("[data-play]").forEach(el =>
    el.addEventListener("click", playCardChime));

  bindSketch();

  const backToEncode = document.getElementById("backToEncode");
  if (backToEncode) backToEncode.addEventListener("click", () => { state.step = "encode"; render(); });

  root.querySelectorAll("[data-place]").forEach(el =>
    el.addEventListener("click", () => placeChip(parseInt(el.dataset.place))));
  root.querySelectorAll("[data-return]").forEach(el =>
    el.addEventListener("click", () => returnChip(parseInt(el.dataset.return))));

  const checkGuided = document.getElementById("checkGuided");
  if (checkGuided) checkGuided.addEventListener("click", checkGuidedAnswer);

  const backToGuided = document.getElementById("backToGuided");
  if (backToGuided) backToGuided.addEventListener("click", () => { state.step = "guided"; render(); });

  const submitFree = document.getElementById("submitFree");
  if (submitFree) submitFree.addEventListener("click", submitFreeAnswer);
  const freeInput = document.getElementById("freeInput");
  if (freeInput) {
    freeInput.focus();
    freeInput.addEventListener("keydown", e => { if (e.key === "Enter") submitFreeAnswer(); });
    freeInput.addEventListener("input", e => { sessionData.free.value = e.target.value; });
  }
}

function placeChip(chipId) {
  const g = sessionData.guided;
  const idx = g.slots.findIndex(s => s === null);
  if (idx === -1) return;
  const chip = g.pool.find(c => c.id === chipId);
  g.slots[idx] = chip;
  g.pool = g.pool.filter(c => c.id !== chipId);
  render();
}

function returnChip(slotIdx) {
  const g = sessionData.guided;
  const chip = g.slots[slotIdx];
  if (!chip) return;
  g.pool.push(chip);
  g.slots[slotIdx] = null;
  render();
}

function checkGuidedAnswer() {
  const brick = BRICKS.find(b => b.id === state.activeBrickId);
  const g = sessionData.guided;
  const built = g.slots.map(s => s.text).join("");
  const target = brick.syllables.join("");
  if (built === target) {
    state.step = "free";
    render();
  } else {
    g.showHint = true;
    g.message = "Presque. Regarde le début du mot ci-dessous et réessaie.";
    render();
    setTimeout(() => { if (sessionData.guided) { sessionData.guided.message = null; render(); } }, 3200);
  }
}

function submitFreeAnswer() {
  const brick = BRICKS.find(b => b.id === state.activeBrickId);
  const f = sessionData.free;
  const input = document.getElementById("freeInput");
  const value = input ? input.value : f.value;
  const target = normalize(brick.word);
  const guess = normalize(value);
  if (guess.length > 2 && target.includes(guess) && guess.length >= target.length - 2) {
    markMastered(brick.id);
    return;
  }
  f.attempts += 1;
  if (f.attempts >= 2) {
    f.revealedLetters = Math.min(f.revealedLetters + 3, brick.word.length);
    f.message = "Voici un petit coup de pouce, lettre par lettre.";
  } else {
    f.message = "Prends un instant. Tu peux redemander un indice si besoin.";
  }
  render();
  setTimeout(() => { if (sessionData.free) { sessionData.free.message = null; render(); } }, 3000);
}

/* -------------------- sketch canvas -------------------- */
function bindSketch() {
  const canvas = document.getElementById("sketchCanvas");
  if (!canvas) return;
  const brick = BRICKS.find(b => b.id === state.activeBrickId);
  const ctx = canvas.getContext("2d");
  let drawing = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function draw(e) {
    if (!drawing) return;
    const { x, y } = pos(e);
    ctx.fillStyle = brick.color;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    e.preventDefault();
  }
  canvas.addEventListener("mousedown", e => { drawing = true; draw(e); });
  canvas.addEventListener("mouseup", () => drawing = false);
  canvas.addEventListener("mouseleave", () => drawing = false);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("touchstart", e => { drawing = true; draw(e); });
  canvas.addEventListener("touchend", () => drawing = false);
  canvas.addEventListener("touchmove", draw);

  const clearBtn = document.getElementById("clearSketch");
  if (clearBtn) clearBtn.addEventListener("click", () => ctx.clearRect(0, 0, canvas.width, canvas.height));
}

loadProgress();
render();
</script>
