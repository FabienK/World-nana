<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2333">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Nana — Home (Rail)</title>
<style>
  :root{
    --bg: #1B2333;
    --text: #F5F1E8;
    --accent: #8FB89D;
    --gold: #E8B75D;
    --card: rgba(245,241,232,0.06);
    --card-border: rgba(245,241,232,0.14);
    --font-ui: ui-rounded, -apple-system, 'SF Pro Rounded', sans-serif;
    --font-body: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  }
  html[data-font="dyslexic"]{ --font-ui: 'Atkinson Hyperlegible', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  .layout { display: flex; min-height: 100vh; max-width: 600px; margin: 0 auto; }

  /* Rail : colonne verticale fixe sur le bord gauche, un raccourci par ligne */
  .rail {
    flex: 0 0 92px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: max(20px, env(safe-area-inset-top)) 8px 20px;
    padding-left: max(8px, env(safe-area-inset-left));
    border-right: 1px solid var(--card-border);
  }
  .rail-item {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text); cursor: pointer; min-height: 76px;
    font-family: var(--font-body); padding: 6px 2px; border-radius: 16px;
  }
  .rail-item:active { background: rgba(245,241,232,0.08); }
  .rail-icon { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .rail-label { font-size: 10.5px; line-height: 1.25; color: rgba(245,241,232,0.75); text-align: center; }

  .content { flex: 1; min-width: 0; padding: 28px 20px 40px; padding-right: max(20px, env(safe-area-inset-right)); }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 12px; }
  .eyebrow { font-family: var(--font-ui); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--font-ui); font-size: 26px; font-weight: 600; margin: 4px 0 0; }
  .font-btn {
    background: rgba(245,241,232,0.08); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 13.5px; cursor: pointer; min-height: 44px; flex-shrink: 0;
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .greeting { margin: 26px 0 8px; font-size: 15.5px; line-height: 1.55; color: rgba(245,241,232,0.7); }

  .offline-banner {
    margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: rgba(232,183,93,0.12);
    border: 1px solid rgba(232,183,93,0.3); color: var(--gold); font-size: 13px; text-align: center;
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Raccourcis"></nav>
  <div class="content">
    <div class="header">
      <div>
        <p class="eyebrow">World's Nana</p>
        <h1>Coucou !</h1>
      </div>
      <button class="font-btn" id="font-toggle" type="button" aria-pressed="false">Aa dyslexie</button>
    </div>
    <p class="greeting">Choisis une app pour t'amuser ou apprendre quelque chose de nouveau.</p>
    <div class="offline-banner" id="offline-banner" hidden>Pas de connexion — les raccourcis déjà installés restent utilisables.</div>
  </div>
</div>

<script>
/* ============================================================
   Home — variante "Rail" : colonne verticale fixe sur le bord,
   raccourcis toujours visibles, contenu principal à côté.
   Liste de raccourcis illustrative — à remplacer par la liste
   définie séparément (voir frontend.md, écran 2).
   ============================================================ */

const SHORTCUTS = [
  { id: 'musique', label: 'Musique', icon: '🎵', color: '#8FB89D', scheme: 'music://', storeUrl: 'https://apps.apple.com/app/apple-music/id1108187390' },
  { id: 'dessin', label: 'Dessiner', icon: '🎨', color: '#E8B75D', scheme: 'shortcuts://', storeUrl: 'https://apps.apple.com/app/procreate-pocket/id427525720' },
  { id: 'lecture', label: 'Lecture', icon: '📚', color: '#C99A6B', scheme: 'shortcuts://', storeUrl: '#' },
  { id: 'jeux', label: 'Jeux éducatifs', icon: '🧩', color: '#7EA8C4', scheme: 'shortcuts://', storeUrl: '#' },
];

function openShortcut(shortcut) {
  const fallbackTimer = setTimeout(() => {
    if (shortcut.storeUrl && shortcut.storeUrl !== '#') window.location.href = shortcut.storeUrl;
  }, 1200);
  window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
  window.location.href = shortcut.scheme;
}

const rail = document.getElementById('rail');
SHORTCUTS.forEach((s) => {
  const btn = document.createElement('button');
  btn.className = 'rail-item';
  btn.type = 'button';
  btn.innerHTML = `<span class="rail-icon" style="background:${s.color}22;color:${s.color}">${s.icon}</span><span class="rail-label">${s.label}</span>`;
  btn.addEventListener('click', () => openShortcut(s));
  rail.appendChild(btn);
});

const fontToggle = document.getElementById('font-toggle');
const FONT_KEY = 'wn.font';
function applyFont(pref) {
  document.documentElement.dataset.font = pref;
  fontToggle.setAttribute('aria-pressed', String(pref === 'dyslexic'));
}
applyFont(localStorage.getItem(FONT_KEY) || 'default');
fontToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.font === 'dyslexic' ? 'default' : 'dyslexic';
  localStorage.setItem(FONT_KEY, next);
  applyFont(next);
});

const offlineBanner = document.getElementById('offline-banner');
function updateOnlineState() { offlineBanner.hidden = navigator.onLine; }
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
