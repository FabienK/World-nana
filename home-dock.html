<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2333">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Nana — Home (Dock)</title>
<style>
  :root{
    --bg: #1B2333;
    --text: #F5F1E8;
    --accent: #8FB89D;
    --gold: #E8B75D;
    --card: rgba(245,241,232,0.06);
    --card-border: rgba(245,241,232,0.14);
    --font-ui: ui-rounded, -apple-system, 'SF Pro Rounded', sans-serif;
    --font-body: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  }
  html[data-font="dyslexic"]{ --font-ui: 'Atkinson Hyperlegible', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    display: flex; justify-content: center; min-height: 100vh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  #root { width: 100%; max-width: 480px; padding: 28px 20px 140px; position: relative; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .eyebrow { font-family: var(--font-ui); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--font-ui); font-size: 26px; font-weight: 600; margin: 4px 0 0; }
  .font-btn {
    background: rgba(245,241,232,0.08); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 13.5px; cursor: pointer; min-height: 44px;
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .greeting { margin: 30px 0 8px; font-size: 15.5px; line-height: 1.55; color: rgba(245,241,232,0.7); }

  .offline-banner {
    margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: rgba(232,183,93,0.12);
    border: 1px solid rgba(232,183,93,0.3); color: var(--gold); font-size: 13px; text-align: center;
  }

  /* Dock: barre flottante en bas, 4 raccourcis visibles + bouton "plus" qui ouvre un tiroir */
  .dock {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 440px; z-index: 30;
    background: rgba(27,35,51,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border); border-radius: 26px; padding: 10px;
    display: flex; gap: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  .dock-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text); padding: 10px 4px; border-radius: 18px; cursor: pointer; min-height: 56px;
    font-family: var(--font-body);
  }
  .dock-item:active { background: rgba(245,241,232,0.08); }
  .dock-icon { width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .dock-label { font-size: 10.5px; color: rgba(245,241,232,0.7); }
  .dock-more { font-size: 20px; }

  .drawer-scrim { position: fixed; inset: 0; background: rgba(4,5,10,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; transform: translateY(100%);
    background: #222B40; border-top: 1px solid var(--card-border); border-radius: 24px 24px 0 0;
    padding: 20px 20px max(24px, env(safe-area-inset-bottom)); transition: transform .3s cubic-bezier(.23,1,.32,1);
    max-height: 70vh; overflow-y: auto;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-grip { width: 36px; height: 4px; border-radius: 3px; background: rgba(245,241,232,0.25); margin: 0 auto 18px; }
  .drawer-title { font-family: var(--font-ui); font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .shortcut-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--text);
    cursor: pointer; min-height: 96px; font-family: var(--font-body);
  }
  .shortcut-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .shortcut-label { font-family: var(--font-ui); font-size: 13.5px; font-weight: 600; }
</style>
</head>
<body>
<div id="root">
  <div class="header">
    <div>
      <p class="eyebrow">World's Nana</p>
      <h1>Coucou !</h1>
    </div>
    <button class="font-btn" id="font-toggle" type="button" aria-pressed="false">Aa dyslexie</button>
  </div>
  <p class="greeting">Choisis une app pour t'amuser ou apprendre quelque chose de nouveau.</p>
  <div class="offline-banner" id="offline-banner" hidden>Pas de connexion — les raccourcis déjà installés restent utilisables.</div>
</div>

<div class="drawer-scrim" id="drawer-scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-grip"></div>
  <p class="drawer-title">Toutes les apps</p>
  <div class="shortcut-grid" id="drawer-grid"></div>
</div>

<nav class="dock" id="dock" aria-label="Raccourcis"></nav>

<script>
/* ============================================================
   Home — variante "Dock" : barre flottante en bas avec les
   raccourcis les plus utilisés + un tiroir pour la liste complète.
   Liste de raccourcis illustrative — à remplacer par la liste
   définie séparément (voir frontend.md, écran 2).
   ============================================================ */

const SHORTCUTS = [
  { id: 'musique', label: 'Musique', icon: '🎵', color: '#8FB89D', scheme: 'music://', storeUrl: 'https://apps.apple.com/app/apple-music/id1108187390' },
  { id: 'dessin', label: 'Dessiner', icon: '🎨', color: '#E8B75D', scheme: 'shortcuts://', storeUrl: 'https://apps.apple.com/app/procreate-pocket/id427525720' },
  { id: 'lecture', label: 'Lecture', icon: '📚', color: '#C99A6B', scheme: 'shortcuts://', storeUrl: '#' },
  { id: 'jeux', label: 'Jeux éducatifs', icon: '🧩', color: '#7EA8C4', scheme: 'shortcuts://', storeUrl: '#' },
];

function openShortcut(shortcut) {
  const fallbackTimer = setTimeout(() => {
    if (shortcut.storeUrl && shortcut.storeUrl !== '#') window.location.href = shortcut.storeUrl;
  }, 1200);
  window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
  window.location.href = shortcut.scheme;
}

const dock = document.getElementById('dock');
SHORTCUTS.slice(0, 3).forEach((s) => {
  const btn = document.createElement('button');
  btn.className = 'dock-item';
  btn.type = 'button';
  btn.innerHTML = `<span class="dock-icon" style="background:${s.color}22;color:${s.color}">${s.icon}</span><span class="dock-label">${s.label}</span>`;
  btn.addEventListener('click', () => openShortcut(s));
  dock.appendChild(btn);
});
const moreBtn = document.createElement('button');
moreBtn.className = 'dock-item';
moreBtn.type = 'button';
moreBtn.innerHTML = `<span class="dock-icon dock-more" style="background:rgba(245,241,232,0.1)">⋯</span><span class="dock-label">Plus</span>`;
dock.appendChild(moreBtn);

const drawer = document.getElementById('drawer');
const scrim = document.getElementById('drawer-scrim');
const drawerGrid = document.getElementById('drawer-grid');
SHORTCUTS.forEach((s) => {
  const card = document.createElement('button');
  card.className = 'shortcut-card';
  card.type = 'button';
  card.innerHTML = `<span class="shortcut-icon" style="background:${s.color}22;color:${s.color}">${s.icon}</span><span class="shortcut-label">${s.label}</span>`;
  card.addEventListener('click', () => openShortcut(s));
  drawerGrid.appendChild(card);
});

function openDrawer() { drawer.classList.add('open'); scrim.classList.add('open'); }
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); }
moreBtn.addEventListener('click', openDrawer);
scrim.addEventListener('click', closeDrawer);

const fontToggle = document.getElementById('font-toggle');
const FONT_KEY = 'wn.font';
function applyFont(pref) {
  document.documentElement.dataset.font = pref;
  fontToggle.setAttribute('aria-pressed', String(pref === 'dyslexic'));
}
applyFont(localStorage.getItem(FONT_KEY) || 'default');
fontToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.font === 'dyslexic' ? 'default' : 'dyslexic';
  localStorage.setItem(FONT_KEY, next);
  applyFont(next);
});

const offlineBanner = document.getElementById('offline-banner');
function updateOnlineState() { offlineBanner.hidden = navigator.onLine; }
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
