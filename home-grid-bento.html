<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2333">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Nana — Home (Grid bento)</title>
<style>
  :root{
    --bg: #1B2333;
    --text: #F5F1E8;
    --accent: #8FB89D;
    --gold: #E8B75D;
    --card: rgba(245,241,232,0.06);
    --card-border: rgba(245,241,232,0.14);
    --font-ui: ui-rounded, -apple-system, 'SF Pro Rounded', sans-serif;
    --font-body: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  }
  html[data-font="dyslexic"]{ --font-ui: 'Atkinson Hyperlegible', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    display: flex; justify-content: center; min-height: 100vh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  #root { width: 100%; max-width: 480px; padding: 28px 20px 40px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 12px; }
  .eyebrow { font-family: var(--font-ui); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--font-ui); font-size: 26px; font-weight: 600; margin: 4px 0 0; }
  .font-btn {
    background: rgba(245,241,232,0.08); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 13.5px; cursor: pointer; min-height: 44px; flex-shrink: 0;
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .greeting { margin: 26px 0 20px; font-size: 15.5px; line-height: 1.55; color: rgba(245,241,232,0.7); }

  .offline-banner {
    margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: rgba(232,183,93,0.12);
    border: 1px solid rgba(232,183,93,0.3); color: var(--gold); font-size: 13px; text-align: center;
  }

  /* Grid bento : une carte vedette (dernière app utilisée / mise en avant) + grille secondaire */
  .bento {
    display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 96px 96px 84px; gap: 14px;
    grid-template-areas: "hero a" "hero b" "wide wide";
  }
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
    display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text);
    cursor: pointer; font-family: var(--font-body); padding: 0 16px; overflow: hidden;
  }
  .card:active { background: rgba(245,241,232,0.1); }
  .card-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card-icon svg { width: 22px; height: 22px; }
  .card-label { font-family: var(--font-ui); font-size: 14px; font-weight: 600; }

  .card-hero {
    grid-area: hero; flex-direction: column; align-items: flex-start; justify-content: center; gap: 14px; padding: 20px;
  }
  .card-hero .card-icon { width: 52px; height: 52px; border-radius: 16px; }
  .card-hero .card-icon svg { width: 26px; height: 26px; }
  .card-hero .card-eyebrow { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .card-hero .card-label { font-size: 17px; }

  .card-a { grid-area: a; }
  .card-b { grid-area: b; }
  .card-wide { grid-area: wide; }
</style>
</head>
<body>
<div id="root">
  <div class="header">
    <div>
      <p class="eyebrow">World's Nana</p>
      <h1>Coucou !</h1>
    </div>
    <button class="font-btn" id="font-toggle" type="button" aria-pressed="false">Aa dyslexie</button>
  </div>
  <p class="greeting">Choisis une app pour t'amuser ou apprendre quelque chose de nouveau.</p>
  <div class="offline-banner" id="offline-banner" hidden>Pas de connexion — les raccourcis déjà installés restent utilisables.</div>
  <div class="bento" id="bento"></div>
</div>

<script>
/* ============================================================
   Home — variante grid "Bento" : une carte vedette (2/3 lignes)
   + 3 cartes secondaires, mise en avant type "App Store".
   Icônes ligne dessinées à la main (pas d'emoji).
   Raccourcis illustratifs — à remplacer par la liste définie
   séparément (voir frontend.md, écran 2).
   ============================================================ */

const ICONS = {
  musique: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5.2L20 3v12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.5" cy="15.8" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>`,
  dessin: `<svg viewBox="0 0 24 24" fill="none"><polygon points="14,3 20,9 9,20 4,20.5 4.5,15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="12" y1="5" x2="18" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  lecture: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 5 Q9 2 11 5 V19 Q9 16 3 19 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M21 5 Q15 2 13 5 V19 Q15 16 21 19 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  jeux: `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="12" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/><rect x="8.5" y="4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6"/></svg>`,
};

const SHORTCUTS = [
  { id: 'musique', label: 'Musique', icon: ICONS.musique, color: '#8FB89D', scheme: 'music://', storeUrl: 'https://apps.apple.com/app/apple-music/id1108187390', slot: 'hero', eyebrow: 'Reprendre' },
  { id: 'dessin', label: 'Dessiner', icon: ICONS.dessin, color: '#E8B75D', scheme: 'shortcuts://', storeUrl: 'https://apps.apple.com/app/procreate-pocket/id427525720', slot: 'a' },
  { id: 'lecture', label: 'Lecture', icon: ICONS.lecture, color: '#C99A6B', scheme: 'shortcuts://', storeUrl: '#', slot: 'b' },
  { id: 'jeux', label: 'Jeux éducatifs', icon: ICONS.jeux, color: '#7EA8C4', scheme: 'shortcuts://', storeUrl: '#', slot: 'wide' },
];

function openShortcut(shortcut) {
  const fallbackTimer = setTimeout(() => {
    if (shortcut.storeUrl && shortcut.storeUrl !== '#') window.location.href = shortcut.storeUrl;
  }, 1200);
  window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
  window.location.href = shortcut.scheme;
}

const bento = document.getElementById('bento');
SHORTCUTS.forEach((s) => {
  const card = document.createElement('button');
  card.className = `card card-${s.slot}`;
  card.type = 'button';
  const eyebrow = s.eyebrow ? `<p class="card-eyebrow">${s.eyebrow}</p>` : '';
  card.innerHTML = `<span class="card-icon" style="background:${s.color}22;color:${s.color}">${s.icon}</span><span>${eyebrow}<span class="card-label">${s.label}</span></span>`;
  card.addEventListener('click', () => openShortcut(s));
  bento.appendChild(card);
});

const fontToggle = document.getElementById('font-toggle');
const FONT_KEY = 'wn.font';
function applyFont(pref) {
  document.documentElement.dataset.font = pref;
  fontToggle.setAttribute('aria-pressed', String(pref === 'dyslexic'));
}
applyFont(localStorage.getItem(FONT_KEY) || 'default');
fontToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.font === 'dyslexic' ? 'default' : 'dyslexic';
  localStorage.setItem(FONT_KEY, next);
  applyFont(next);
});

const offlineBanner = document.getElementById('offline-banner');
function updateOnlineState() { offlineBanner.hidden = navigator.onLine; }
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
