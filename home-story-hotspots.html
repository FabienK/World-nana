<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140D08">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Nana — Home (Seuil / hotspots)</title>
<style>
  :root{
    --bg: #140D08;
    --text: #F3E7CE;
    --muted: rgba(243,231,206,0.68);
    --accent: #E8A94D;
    --card-border: rgba(243,231,206,0.18);
    --font-display: 'Fraunces', ui-rounded, -apple-system, 'SF Pro Rounded', sans-serif;
    --font-body: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  }
  html[data-font="dyslexic"]{ --font-display: 'Atkinson Hyperlegible', sans-serif; --font-body: 'Atkinson Hyperlegible', sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    display: flex; justify-content: center; min-height: 100vh;
  }
  #root { width: 100%; max-width: 900px; }

  /* Scène : l'illustration entière sert de théâtre, les raccourcis sont
     des zones tactiles diégétiques posées sur les objets de la pièce. */
  .scene { position: relative; width: 100%; }
  .scene img { width: 100%; display: block; }
  .scene::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none;
  }
  .scene-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: max(18px, env(safe-area-inset-top)) 20px 40px;
    background: linear-gradient(180deg, rgba(10,6,3,0.75), transparent);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 4px 0 0; }
  .font-btn {
    background: rgba(20,13,8,0.55); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-family: var(--font-body); font-size: 13.5px; cursor: pointer; min-height: 44px; flex-shrink: 0;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .hotspot { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; padding: 0; transform: translate(-50%, -50%); }
  .hotspot-dot {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(243,231,206,0.75);
    background: rgba(232,169,77,0.28); box-shadow: 0 0 0 0 rgba(232,169,77,0.55);
    animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(232,169,77,0.5); }
    70% { box-shadow: 0 0 0 14px rgba(232,169,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,169,77,0); }
  }
  .hotspot-label {
    font-family: var(--font-body); font-size: 11.5px; font-weight: 600; color: var(--text);
    background: rgba(20,13,8,0.72); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 5px 11px; white-space: nowrap; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }

  .below { padding: 6px 20px 40px; position: relative; z-index: 3; margin-top: -8%; }
  .greeting { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 46ch; }
  .offline-banner {
    margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(232,169,77,0.12);
    border: 1px solid rgba(232,169,77,0.32); color: var(--accent); font-size: 13px; text-align: center;
  }
</style>
</head>
<body>
<div id="root">
  <div class="scene">
    <img src="./assets/portal-full.jpg" alt="Chambre d'enfant, une porte ouverte laisse voir un tourbillon lumineux.">
    <div class="scene-header">
      <div>
        <p class="eyebrow">World's Nana</p>
        <h1>Ta chambre, ce soir</h1>
      </div>
      <button class="font-btn" id="font-toggle" type="button" aria-pressed="false">Aa dyslexie</button>
    </div>
    <div id="hotspots"></div>
  </div>
  <div class="below">
    <p class="greeting">Touche un objet de la pièce pour ouvrir une app.</p>
    <div class="offline-banner" id="offline-banner" hidden>Pas de connexion — les raccourcis déjà installés restent utilisables.</div>
  </div>
</div>

<script>
/* ============================================================
   Home — variante "Seuil" : hotspots diégétiques posés sur les
   objets de l'illustration (voir assets/portal-full.jpg).
   Positions en % de l'image, alignées sur son ratio naturel
   (pas d'object-fit:cover) pour rester justes à toute largeur.
   Raccourcis illustratifs — à remplacer par la liste définie
   séparément (voir frontend.md, écran 2).
   ============================================================ */

const SHORTCUTS = [
  { id: 'musique', label: 'Musique', left: 5, top: 39, scheme: 'music://', storeUrl: 'https://apps.apple.com/app/apple-music/id1108187390' },
  { id: 'lecture', label: 'Lecture', left: 85, top: 29, scheme: 'shortcuts://', storeUrl: '#' },
  { id: 'jeux', label: 'Jeux éducatifs', left: 83, top: 47, scheme: 'shortcuts://', storeUrl: '#' },
  { id: 'dessin', label: 'Dessiner', left: 90, top: 41, scheme: 'shortcuts://', storeUrl: 'https://apps.apple.com/app/procreate-pocket/id427525720' },
];

function openShortcut(shortcut) {
  const fallbackTimer = setTimeout(() => {
    if (shortcut.storeUrl && shortcut.storeUrl !== '#') window.location.href = shortcut.storeUrl;
  }, 1200);
  window.addEventListener('blur', () => clearTimeout(fallbackTimer), { once: true });
  window.location.href = shortcut.scheme;
}

const hotspots = document.getElementById('hotspots');
SHORTCUTS.forEach((s) => {
  const btn = document.createElement('button');
  btn.className = 'hotspot';
  btn.type = 'button';
  btn.style.left = s.left + '%';
  btn.style.top = s.top + '%';
  btn.setAttribute('aria-label', s.label);
  btn.innerHTML = `<span class="hotspot-dot"></span><span class="hotspot-label">${s.label}</span>`;
  btn.addEventListener('click', () => openShortcut(s));
  hotspots.appendChild(btn);
});

const fontToggle = document.getElementById('font-toggle');
const FONT_KEY = 'wn.font';
function applyFont(pref) {
  document.documentElement.dataset.font = pref;
  fontToggle.setAttribute('aria-pressed', String(pref === 'dyslexic'));
}
applyFont(localStorage.getItem(FONT_KEY) || 'default');
fontToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.font === 'dyslexic' ? 'default' : 'dyslexic';
  localStorage.setItem(FONT_KEY, next);
  applyFont(next);
});

const offlineBanner = document.getElementById('offline-banner');
function updateOnlineState() { offlineBanner.hidden = navigator.onLine; }
window.addEventListener('online', updateOnlineState);
window.addEventListener('offline', updateOnlineState);
updateOnlineState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
